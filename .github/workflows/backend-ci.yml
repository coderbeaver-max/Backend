
name: Backend CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate FastAPI Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: python -m pip install pytest httpx

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run automated tests
        env:
          GEMINI_API_KEY: ci-test-key
        run: python -m pytest -q

  terraform-validate:
    name: Validate AWS Terraform Configuration
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/aws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without a remote backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Check Terraform plan
        run: terraform plan -input=false -lock=false
