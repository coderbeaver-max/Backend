
name: Backend CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate FastAPI Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: python -m pip install pytest httpx

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run automated tests
        env:
          GEMINI_API_KEY: ci-test-key
        run: python -m pytest -q

  docker-integration:
    name: Docker Container Integration Test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag jarvis-backend:ci .

      - name: Start backend container
        run: |
          docker run -d \
            --name jarvis-backend-ci \
            -p 8000:8000 \
            -e GEMINI_API_KEY=ci-test-key \
            -e PORT=8000 \
            jarvis-backend:ci

      - name: Wait for backend health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health \
              --output /tmp/health.json; then
              echo "Backend health endpoint responded."
              cat /tmp/health.json
              exit 0
            fi

            echo "Waiting for backend startup: attempt ${attempt}/30"
            sleep 2
          done

          echo "Backend failed to respond within 60 seconds."
          docker logs jarvis-backend-ci
          exit 1

      - name: Validate health response
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "http://127.0.0.1:8000/api/health"

          with urllib.request.urlopen(url, timeout=5) as response:
              assert response.status == 200
              data = json.load(response)

          assert data["status"] == "healthy", data
          assert data["server"] == "running", data
          assert isinstance(data["allowed_models"], list), data
          assert len(data["allowed_models"]) > 0, data

          print("Health response validation passed.")
          print(json.dumps(data, indent=2))
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker logs jarvis-backend-ci

      - name: Clean up container
        if: always()
        run: |
          docker stop jarvis-backend-ci || true
          docker rm -f jarvis-backend-ci || true

  terraform-validate:
    name: Validate AWS Terraform Configuration
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/aws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without a remote backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Check Terraform plan
        run: terraform plan -input=false -lock=false
